
{% load static %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 50% Spend Heat Map</title>
    <link rel="stylesheet" href="{% static 'inventory/heatmap.css' %}">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1>Top 50% Spend Heat Map</h1>
    </header>

    <div class="heat-map-container">
        <canvas id="heat-map"></canvas>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Heatmap rendering
            const heatMapData = JSON.parse('{{ heat_map_data|escapejs }}');
            renderHeatMap(heatMapData);
        });

        // Function to render the heatmap
        function renderHeatMap(heatMapData) {
            const ctx = document.getElementById('heat-map').getContext('2d');
            
            const labels = heatMapData.map(data => data.product_name);
            const data = heatMapData.map(data => data.total_spend);

            const backgroundColors = data.map(value => {
                return `rgba(75, 192, 192, ${value / Math.max(...data)})`;
            });

            new Chart(ctx, {
                type: 'bar',  // Use a bar chart for now
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Top 50% Spend',
                        data: data,
                        backgroundColor: backgroundColors,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>

{% endblock %}
